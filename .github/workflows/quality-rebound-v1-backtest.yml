name: SIDI Quality Rebound V1 Backtest
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  backtest:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install "yfinance>=0.2.65" "pandas>=2.0"
      - run: python -m py_compile research/quality_75_correction_swing.py research/quality_rebound_backtest_v1.py
      - name: Run Quality Rebound V1 exploratory backtest
        run: python research/quality_rebound_backtest_v1.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: quality-rebound-v1-backtest
          path: results/quality_swing/quality_rebound_v1/
          retention-days: 14
          if-no-files-found: warn

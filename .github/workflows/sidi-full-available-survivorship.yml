name: SIDI Full Available Survivorship

on:
  workflow_dispatch:
  push:
    branches:
      - sidi-backtest-improvements
    paths:
      - backtest_oos_2020_2024_full_available.py
      - .github/workflows/sidi-full-available-survivorship.yml

permissions:
  contents: read

jobs:
  backtest:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - name: Checkout experimental branch
        uses: actions/checkout@v4
        with:
          ref: sidi-backtest-improvements

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run full-available survivorship backtest
        run: python backtest_oos_2020_2024_full_available.py

      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sidi-full-available-survivorship
          if-no-files-found: warn
          path: |
            sidi_full_available_survivorship.json
            sidi_full_available_survivorship_summary.csv
            sidi_full_available_survivorship_by_year.csv
            sidi_full_available_membership_price_coverage.csv
            sidi_full_available_pit_coverage.csv
            sidi_full_available_pit_coverage_by_year.csv
            sidi_current_tech_only_trades.csv
            sidi_full_available_tech_only_trades.csv
            sidi_current_pit66_trades.csv
            sidi_full_available_pit66_trades.csv

name: SIDI yFinance PIT Proxy Smoke

on:
  push:
    branches:
      - sidi-backtest-improvements
    paths:
      - 'yfinance_pit_proxy.py'
      - '.github/workflows/sidi-yf-pit-proxy-smoke.yml'

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Reconstruct conservative PIT proxy at 2025-06-30
        run: python yfinance_pit_proxy.py --asof 2025-06-30 --tickers AAPL,MSFT,NVDA,JPM,XOM,JNJ,PG,CAT --out yf_pit_20250630.csv
      - name: Reconstruct conservative PIT proxy at 2024-12-31
        run: python yfinance_pit_proxy.py --asof 2024-12-31 --tickers AAPL,MSFT,NVDA,JPM,XOM,JNJ,PG,CAT --out yf_pit_20241231.csv
      - name: Upload outputs
        uses: actions/upload-artifact@v4
        with:
          name: sidi-yf-pit-proxy-smoke
          path: |
            yf_pit_20250630.csv
            yf_pit_20241231.csv

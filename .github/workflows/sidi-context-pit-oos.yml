name: SIDI Context PIT OOS

on:
  push:
    branches:
      - sidi-backtest-improvements
    paths:
      - 'backtest_context_filters_pit_oos.py'
      - '.github/workflows/sidi-context-pit-oos.yml'

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - name: Checkout experimental branch
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Run calibrated PIT context OOS
        run: python backtest_context_filters_pit_oos.py
      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sidi-context-pit-oos
          path: |
            sidi_context_pit_full.csv
            sidi_context_pit_windows.csv
            sidi_context_pit_coverage.csv
            sidi_context_pit_coverage_summary.csv
            sidi_context_pit_results.json
          if-no-files-found: warn

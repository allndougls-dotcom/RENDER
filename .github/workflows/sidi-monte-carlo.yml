name: SIDI Monte Carlo Stress
on:
  workflow_dispatch:
  push:
    branches: [sidi-backtest-improvements]
    paths:
      - 'stress_monte_carlo.py'
      - '.github/workflows/sidi-monte-carlo.yml'
permissions:
  contents: read
jobs:
  backtest:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout experimental branch
        uses: actions/checkout@v4
        with:
          ref: sidi-backtest-improvements
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Run Monte Carlo stress
        run: python stress_monte_carlo.py
      - name: Upload results
        uses: actions/upload-artifact@v4
        with:
          name: sidi-monte-carlo
          path: |
            sidi_monte_carlo_runs.csv
            sidi_monte_carlo_summary.csv
            sidi_monte_carlo_representative_trades.csv
            sidi_monte_carlo_pit_coverage.csv
            sidi_monte_carlo.json
          if-no-files-found: warn

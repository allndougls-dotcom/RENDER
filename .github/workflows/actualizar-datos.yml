name: Actualizar datos STOCK-RADAR
on:
  push:
    branches: [main]
    paths:
      - "main_ingesta.py"
      - "modules/shadow_tracker.py"
      - "modules/ingesta/**"
      - ".github/workflows/actualizar-datos.yml"
  workflow_dispatch:
  schedule:
    # Ingesta a las 09:35 de America/New_York, cinco minutos después
    # de la apertura. Los dos cron UTC cubren EST/EDT; el primer paso
    # selecciona uno para evitar duplicados durante los cambios de hora.
    - cron: "35 13 * * 1-5"
    - cron: "35 14 * * 1-5"
permissions:
  contents: write
concurrency:
  group: actualizar-datos-stock-radar
  cancel-in-progress: false
jobs:
  actualizar:
    name: Ejecutar ingesta y publicar CSV
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - name: Comprobar apertura de Nueva York
        id: horario
        env:
          EVENT_NAME: ${{ github.event_name }}
          EVENT_SCHEDULE: ${{ github.event.schedule }}
        run: |
          if [ "$EVENT_NAME" = "workflow_dispatch" ] || [ "$EVENT_NAME" = "push" ]; then
            echo "should_run=true" >> "$GITHUB_OUTPUT"
            echo "Ejecución autorizada por evento $EVENT_NAME."
            exit 0
          fi

          OFFSET_NY="$(TZ=America/New_York date +%z)"
          if { [ "$OFFSET_NY" = "-0400" ] && [ "$EVENT_SCHEDULE" = "35 13 * * 1-5" ]; } || \
             { [ "$OFFSET_NY" = "-0500" ] && [ "$EVENT_SCHEDULE" = "35 14 * * 1-5" ]; }; then
            echo "should_run=true" >> "$GITHUB_OUTPUT"
            echo "Es el disparador de las 09:35 de America/New_York."
          else
            echo "should_run=false" >> "$GITHUB_OUTPUT"
            echo "Disparador UTC auxiliar omitido para evitar una ejecución duplicada."
          fi

      - name: Descargar repositorio
        if: steps.horario.outputs.should_run == 'true'
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Configurar Python
        if: steps.horario.outputs.should_run == 'true'
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Instalar dependencias
        if: steps.horario.outputs.should_run == 'true'
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Preparar directorio de datos
        if: steps.horario.outputs.should_run == 'true'
        run: |
          mkdir -p data/master
          rm -f data/master/market_context.json

      - name: Ejecutar ingesta completa
        if: steps.horario.outputs.should_run == 'true'
        env:
          MAX_EMPRESAS: "503"
          YEARS_HISTORY: "2"
          PYTHONUNBUFFERED: "1"
          TURSO_DATABASE_URL: ${{ secrets.TURSO_DATABASE_URL }}
          TURSO_AUTH_TOKEN: ${{ secrets.TURSO_AUTH_TOKEN }}
        run: python main_ingesta.py

      - name: Comprobar resultado
        if: steps.horario.outputs.should_run == 'true'
        run: |
          test -n "$(find data/master -maxdepth 1 -name 'sp500_full_export_*.csv' -print -quit)"
          test -f data/master/market_context.json
          ls -lh data/master

      - name: Publicar datos actualizados
        if: steps.horario.outputs.should_run == 'true'
        run: |
          set -e
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          TMP_DIR="$(mktemp -d)"
          find data/master -maxdepth 1 -name 'sp500_full_export_*.csv' -print0 | sort -z | tail -z -n 1 | xargs -0 -I{} cp "{}" "$TMP_DIR/"
          cp data/master/market_context.json "$TMP_DIR/market_context.json"

          MAX_INTENTOS=5
          intento=1

          while true; do
            echo "Sincronizando con origin/main antes de publicar (intento $intento/$MAX_INTENTOS)..."
            git fetch origin main
            git reset --hard origin/main

            mkdir -p data/master
            rm -f data/master/sp500_full_export_*.csv
            cp "$TMP_DIR"/sp500_full_export_*.csv data/master/
            cp "$TMP_DIR/market_context.json" data/master/market_context.json

            git add -f data/master/sp500_full_export_*.csv data/master/market_context.json
            git add -u data/master

            if git diff --cached --quiet; then
              echo "Los datos no han cambiado; no se crea ningún commit."
              exit 0
            fi

            git commit -m "data: actualizar STOCK-RADAR [skip actions]"

            if git push origin HEAD:main; then
              echo "✅ Datos publicados correctamente en main."
              break
            fi

            if [ "$intento" -ge "$MAX_INTENTOS" ]; then
              echo "::error::No se pudo publicar tras $MAX_INTENTOS intentos."
              exit 1
            fi

            echo "El remoto cambió durante el push; reintentando sobre el main más reciente..."
            intento=$((intento + 1))
            sleep $((RANDOM % 10 + 5))
          done

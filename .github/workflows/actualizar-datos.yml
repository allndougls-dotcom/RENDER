name: Actualizar datos STOCK-RADAR
on:
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: actualizar-datos-stock-radar
  cancel-in-progress: false
jobs:
  actualizar:
    name: Ejecutar ingesta y publicar CSV
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4
      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Eliminar exportación anterior
        run: |
          mkdir -p data/master
          rm -f data/master/sp500_full_export_*.csv
          rm -f data/master/market_context.json
      - name: Ejecutar ingesta completa
        env:
          MAX_EMPRESAS: "503"
          YEARS_HISTORY: "2"
          PYTHONUNBUFFERED: "1"
        run: python main_ingesta.py
      - name: Comprobar resultado
        run: |
          test -n "$(find data/master -maxdepth 1 -name 'sp500_full_export_*.csv' -print -quit)"
          test -f data/master/market_context.json
          ls -lh data/master
      - name: Publicar datos actualizados
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f data/master/sp500_full_export_*.csv data/master/market_context.json
          git add -u data/master
          if git diff --cached --quiet; then
            echo "Los datos no han cambiado; no se crea ningún commit."
            exit 0
          fi

          git commit -m "data: actualizar STOCK-RADAR [skip actions]"

          # El checkout se hizo al INICIO del job (hace ~13 min con la ingesta
          # completa de por medio) — si alguien más subió commits a main
          # mientras tanto, el push directo se rechaza ("fetch first").
          # Sincronizamos con el remoto antes de empujar, con reintentos
          # por si hay una carrera entre varias ejecuciones casi simultáneas.
          MAX_INTENTOS=5
          intento=1
          until git push; do
            if [ "$intento" -ge "$MAX_INTENTOS" ]; then
              echo "::error::No se pudo publicar tras $MAX_INTENTOS intentos de sincronización."
              exit 1
            fi
            echo "Push rechazado (intento $intento/$MAX_INTENTOS) — sincronizando con el remoto y reintentando..."
            # --rebase: reaplica nuestro commit de datos ENCIMA de lo que haya
            # nuevo en main, en vez de crear un merge commit. Como este job
            # solo toca data/master/, no debería haber conflictos reales salvo
            # que alguien edite esos mismos archivos a mano en paralelo.
            if ! git pull --rebase origin main; then
              echo "::error::git pull --rebase falló — puede haber un conflicto real que requiere revisión manual."
              git rebase --abort || true
              exit 1
            fi
            intento=$((intento + 1))
            sleep $((RANDOM % 10 + 5))  # pequeña espera aleatoria para desincronizar reintentos concurrentes
          done

          echo "✅ Datos publicados correctamente en main."

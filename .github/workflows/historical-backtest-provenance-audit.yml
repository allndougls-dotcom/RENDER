name: SIDI Historical Backtest Provenance Audit
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m py_compile research/backtest_provenance_audit.py
      - run: python research/backtest_provenance_audit.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: historical-backtest-provenance-audit
          path: results/sidi_growth/backtest_provenance/
          retention-days: 30
          if-no-files-found: warn

name: SIDI Risk Sizing Stress

on:
  workflow_dispatch:
  push:
    branches:
      - sidi-backtest-improvements
    paths:
      - stress_risk_sizing.py
      - .github/workflows/sidi-risk-sizing-stress.yml

permissions:
  contents: read
  actions: read

jobs:
  backtest:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - name: Checkout experimental branch
        uses: actions/checkout@v4
        with:
          ref: sidi-backtest-improvements

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Download frozen validation snapshot V1
        uses: actions/download-artifact@v4
        with:
          name: sidi-validation-snapshot-v1
          path: .
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: allndougls-dotcom/RENDER
          run-id: 36388076425

      - name: Run risk sizing stress
        run: python stress_risk_sizing.py

      - name: Upload results
        uses: actions/upload-artifact@v4
        with:
          name: sidi-risk-sizing-stress
          path: |
            sidi_risk_sizing_runs.csv
            sidi_risk_sizing_summary.csv
            sidi_risk_sizing.json
          if-no-files-found: error
          retention-days: 90
          compression-level: 6

name: SIDI PIT Snapshot Backfill

on:
  push:
    branches:
      - sidi-backtest-improvements
    paths:
      - 'backfill_git_fundamentals.py'
      - 'snapshot_fundamentals.py'
      - '.github/workflows/sidi-backfill-history.yml'

permissions:
  contents: write

jobs:
  backfill:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout full Git history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install minimal dependencies
        run: pip install pandas

      - name: Recover historical compact snapshots
        run: python backfill_git_fundamentals.py

      - name: Commit recovered snapshots to experiment branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f data/history/fundamentals/fundamentals_*.csv
          if git diff --cached --quiet; then
            echo "No hay snapshots nuevos que publicar."
            exit 0
          fi
          git commit -m "data: backfill PIT fundamentals from Git history [skip actions]"
          git push origin HEAD:sidi-backtest-improvements

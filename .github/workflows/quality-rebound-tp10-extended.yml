name: SIDI Quality Rebound TP10 Extended
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  study:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install "yfinance>=0.2.65" "pandas>=2.0"
      - run: python -m py_compile research/quality_rebound_tp10_extended.py
      - name: Evaluate TP10 sensitivity and historical price-only control
        run: python research/quality_rebound_tp10_extended.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: quality-rebound-tp10-extended
          path: results/quality_swing/quality_rebound_tp10_extended/
          retention-days: 14
          if-no-files-found: warn

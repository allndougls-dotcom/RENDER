name: SIDI Original Ingest Entry Diagnostics
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install "yfinance>=0.2.65" "pandas>=2.0"
      - run: python research/recover_original_ingesta_history.py
      - run: python -m py_compile research/original_ingesta_entry_diagnostics.py
      - run: python research/original_ingesta_entry_diagnostics.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: sidi-entry-diagnostics
          path: results/quality_swing/entry_diagnostics/
          retention-days: 14
          if-no-files-found: warn

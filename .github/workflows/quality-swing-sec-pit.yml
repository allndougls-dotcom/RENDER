name: QUALITY SWING SEC PIT research
on:
  workflow_dispatch:
    inputs:
      asof:
        description: 'Historical as-of date (YYYY-MM-DD)'
        required: true
        default: '2024-06-28'
      limit:
        description: 'Max companies to fetch for coverage pilot'
        required: true
        default: '50'
permissions:
  contents: read
jobs:
  sec-pit:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Validate SEC contact configuration
        env:
          SEC_USER_AGENT: ${{ secrets.SEC_USER_AGENT }}
        run: |
          if [ -z "$SEC_USER_AGENT" ]; then
            echo "::error::Configure secret SEC_USER_AGENT with your real contact email before running this research workflow."
            exit 1
          fi
      - name: Build CIK universe from latest SIDI master
        env:
          SEC_USER_AGENT: ${{ secrets.SEC_USER_AGENT }}
        run: |
          python research/build_sec_universe.py --user-agent "$SEC_USER_AGENT"
      - name: Validate historical filing selection
        run: python research/test_sec_pit.py
      - name: Test historical ratio reconstruction
        run: python research/test_pit_ratios.py
      - name: Test point-in-time TTM and score eligibility
        run: |
          python research/test_sec_ttm.py
          python research/test_score_readiness.py
      - name: SEC point-in-time pilot
        env:
          SEC_USER_AGENT: ${{ secrets.SEC_USER_AGENT }}
        run: |
          python research/sec_pit_batch.py --universe-csv results/quality_swing/sec_universe.csv --asof "${{ inputs.asof }}" --limit "${{ inputs.limit }}"
      - name: Summarize historical ratio coverage
        run: python research/pit_ratios.py
      - name: Audit historical score readiness
        run: python research/score_readiness.py
      - name: Compute aligned historical TTM ratios
        run: python research/ttm_metrics.py
      - name: Install OHLCV dependencies
        run: python -m pip install pandas numpy yfinance
      - name: Download historical bars for SEC pilot universe
        run: python research/download_quality_prices.py --universe-csv results/quality_swing/sec_universe.csv --prices data/backtest_prices --years 10 --limit "${{ inputs.limit }}"
      - name: Reconstruct dated technical gates
        run: python research/technical_pit.py --prices data/backtest_prices --out results/quality_swing/technical_pit
      - name: Test exact historical technical score
        run: python research/test_exact_technical_score.py
      - name: Compute exact production technical score at historical close
        run: python research/exact_technical_score.py --asof "${{ inputs.asof }}"
      - name: Test cross-module historical audit
        run: python research/test_integrated_readiness.py
      - name: Integrate financial and technical coverage
        run: python research/integrated_readiness.py --asof "${{ inputs.asof }}"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: quality-sec-pit-coverage
          path: results/quality_swing/
          if-no-files-found: warn
          retention-days: 30

name: SIDI Growth PIT Coverage Audit
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Check syntax
        run: python -m py_compile research/sidi_growth_pit_audit.py
      - name: Audit score coverage, formula and historical PIT files
        run: python research/sidi_growth_pit_audit.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: sidi-growth-pit-audit
          path: results/sidi_growth/pit_audit/
          retention-days: 30
          if-no-files-found: warn

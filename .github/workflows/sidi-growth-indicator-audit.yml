name: SIDI Growth Indicator Availability Audit
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install "yfinance>=0.2.65" "pandas>=2.0"
      - run: python -m py_compile research/sidi_growth_indicator_audit.py
      - run: python research/sidi_growth_indicator_audit.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: sidi-growth-indicator-availability
          path: results/sidi_growth/indicator_audit/
          retention-days: 30
          if-no-files-found: warn

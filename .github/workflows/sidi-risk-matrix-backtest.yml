name: SIDI Risk Matrix Backtest

on:
  push:
    branches: [sidi-risk-matrix]
    paths:
      - 'risk_matrix_backtest.py'
      - '.github/workflows/sidi-risk-matrix-backtest.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  risk-matrix:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout experimental branch
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Compile risk engine
        run: |
          python -m py_compile risk_matrix_backtest.py backtest.py

      - name: Run 4-year portfolio risk matrix
        run: |
          python risk_matrix_backtest.py --years 4

      - name: Validate matrix output
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p = Path('data/risk_matrix/risk_matrix_summary.json')
          assert p.exists(), 'Missing summary JSON'
          data = json.loads(p.read_text(encoding='utf-8'))
          assert data['strategy_version'] == 'SIDI_INTRADAY_V2'
          assert data['matrix']['configurations_tested'] == 77, data['matrix']
          baseline = data.get('baseline_current_1_5x3')
          assert baseline, 'Missing current 1.5% / 4.5% baseline'
          assert abs(float(baseline['trade_risk_pct']) - 1.5) < 1e-9
          assert abs(float(baseline['portfolio_risk_cap_pct']) - 4.5) < 1e-9
          assert data.get('best_by_calmar'), 'Missing best Calmar config'
          assert data.get('pareto_front'), 'Missing Pareto frontier'
          print('OK:', data['date_range'])
          print('FULL setups:', data['signal_counts']['full_setups'])
          print('Baseline:', baseline)
          print('Best Calmar:', data['best_by_calmar'])
          PY

      - name: Upload results artifact
        uses: actions/upload-artifact@v4
        with:
          name: sidi-risk-matrix-results
          path: |
            data/risk_matrix/risk_matrix_results.csv
            data/risk_matrix/risk_matrix_pareto.csv
            data/risk_matrix/risk_matrix_summary.json
            data/risk_matrix/risk_matrix_details.json
          retention-days: 30

      - name: Commit results to experimental branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/risk_matrix/
          if git diff --cached --quiet; then
            echo "No result changes to commit"
          else
            git commit -m "backtest: store SIDI risk matrix results [skip actions]"
            git push
          fi

name: SIDI Quality 7.5 Correction Long Swing
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  research:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install "yfinance>=0.2.65" "pandas>=2.0"
      - run: python -m py_compile research/quality_75_correction_swing.py
      - name: Research original score 7.5 correction swings
        run: python research/quality_75_correction_swing.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: quality-75-correction-long-swing
          path: results/quality_swing/quality_75_correction/
          retention-days: 14
          if-no-files-found: warn

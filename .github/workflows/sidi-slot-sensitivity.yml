name: SIDI Slot Sensitivity

on:
  push:
    branches:
      - sidi-backtest-improvements
    paths:
      - 'validate_position_slots.py'
      - '.github/workflows/sidi-slot-sensitivity.yml'
      - 'backtest_experiments.py'
      - 'validate_sidi_candidate.py'

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
      - run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Validate slot counts
        run: python validate_position_slots.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: sidi-slot-sensitivity
          path: sidi_slot_sensitivity.csv
          if-no-files-found: warn

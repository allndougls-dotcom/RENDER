name: SIDI Context Threshold Stability

on:
  workflow_dispatch:
  push:
    branches:
      - sidi-backtest-improvements
    paths:
      - backtest_context_threshold_stability.py
      - .github/workflows/sidi-context-threshold-stability.yml

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout experimental branch
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run threshold stability grid
        run: python backtest_context_threshold_stability.py

      - name: Upload results
        uses: actions/upload-artifact@v4
        with:
          name: sidi-context-threshold-stability
          path: |
            sidi_context_threshold_stability.csv
            sidi_context_threshold_stability.json
            sidi_context_threshold_stability_coverage.csv
            sidi_stability_*.csv
          if-no-files-found: warn

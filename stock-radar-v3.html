<style>
:root {
  --bg: #07090f;
  --bg2: #0c0f1a;
  --bg3: #111522;
  --border: #1c2035;
  --border2: #252840;
  --text: #d8ddf0;
  --text2: #7880a0;
  --text3: #3a4060;
  --green: #22c55e;
  --green-dim: #14532d;
  --red: #ef4444;
  --red-dim: #450a0a;
  --amber: #f59e0b;
  --amber-dim: #451a03;
  --blue: #3b82f6;
  --blue-dim: #1e3a5f;
  --purple: #a855f7;
  --accent: #4ade80;
  --accent2: #86efac;
}

* { margin: 0; padding: 0; box-sizing: border-box; }

html {
  scroll-padding-top: env(safe-area-inset-top, 0px);
}
body {
  background: var(--bg);
  color: var(--text);
  font-family: 'DM Mono', monospace;
  font-size: 13px;
  line-height: 1.6;
  min-height: 100vh;
  min-height: 100dvh;
  padding-bottom: env(safe-area-inset-bottom, 0px);
}

/* HEADER */
.header {
  border-bottom: 1px solid var(--border);
  padding: calc(16px + env(safe-area-inset-top, 0px)) 28px 16px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  position: sticky;
  top: 0;
  z-index: 100;
  background: rgba(7,9,15,0.95);
  backdrop-filter: blur(12px);
}

.logo {
  font-family: 'Syne', sans-serif;
  font-weight: 800;
  font-size: 18px;
  letter-spacing: -0.5px;
  color: #fff;
  display: flex;
  align-items: center;
  gap: 10px;
}

.logo-dot {
  width: 8px; height: 8px;
  background: var(--accent);
  border-radius: 50%;
  animation: pulse 2s infinite;
}

@keyframes pulse {
  0%,100% { opacity: 1; transform: scale(1); }
  50% { opacity: 0.4; transform: scale(0.8); }
}

.cc-nav-btn {
  font-family: 'DM Mono', monospace;
  font-size: 11px;
  font-weight: 700;
  letter-spacing: 1px;
  padding: 8px 16px;
  border-radius: 6px;
  border: 1px solid rgba(168, 85, 247, 0.4);
  background: rgba(168, 85, 247, 0.08);
  color: #c084fc;
  cursor: pointer;
  transition: all 0.2s ease;
}

.cc-nav-btn:hover {
  background: rgba(168, 85, 247, 0.18);
  border-color: #a855f7;
}

.cc-nav-btn.cc-active {
  background: linear-gradient(135deg, #a855f7, #7c3aed);
  border-color: #a855f7;
  color: #fff;
  box-shadow: 0 0 16px rgba(168, 85, 247, 0.4);
}

.cc-back-btn {
  border-color: rgba(34, 197, 94, 0.4);
  background: rgba(34, 197, 94, 0.08);
  color: var(--accent);
}
.cc-back-btn:hover {
  background: rgba(34, 197, 94, 0.18);
  border-color: var(--accent);
}

body.cc-mode {
  background: radial-gradient(ellipse at top, rgba(88, 28, 135, 0.15), transparent 60%), var(--bg);
}

.cc-ext-tab {
  color: var(--text2);
  border-bottom: 2px solid transparent;
}
.cc-ext-tab:hover {
  color: #c084fc;
}
.cc-ext-tab.active {
  color: #c084fc !important;
  border-bottom-color: #a855f7 !important;
}

body.cc-mode .header {
  border-bottom-color: rgba(168, 85, 247, 0.25);
}

.header-right {
  display: flex;
  align-items: center;
  gap: 12px;
}

.status-pill {
  font-size: 10px;
  padding: 4px 10px;
  border-radius: 20px;
  letter-spacing: 1px;
  text-transform: uppercase;
}

.status-sample { background: var(--amber-dim); color: var(--amber); border: 1px solid #713f12; }
.status-live { background: var(--green-dim); color: var(--green); border: 1px solid #166534; }

/* NAV TABS */
.nav {
  display: flex;
  gap: 2px;
  padding: 12px 28px 0;
  border-bottom: 1px solid var(--border);
  overflow-x: auto;
}

.nav-tab {
  padding: 8px 16px;
  font-size: 11px;
  letter-spacing: 1.5px;
  text-transform: uppercase;
  color: var(--text2);
  cursor: pointer;
  border-bottom: 2px solid transparent;
  transition: all 0.2s;
  white-space: nowrap;
  background: none;
  border-top: none;
  border-left: none;
  border-right: none;
  font-family: 'DM Mono', monospace;
}

.nav-tab:hover { color: var(--text); }
.nav-tab.active { color: var(--accent); border-bottom-color: var(--accent); }

/* MAIN LAYOUT */
.main { padding: 24px 28px; max-width: 1400px; margin: 0 auto; }

/* SKELETON LOADER — filas de tabla mientras se cargan datos */
.skeleton-row td {
  padding: 10px 12px;
}
.skeleton-bar {
  height: 12px;
  border-radius: 4px;
  background: linear-gradient(90deg, var(--bg3) 25%, var(--border2) 50%, var(--bg3) 75%);
  background-size: 200% 100%;
  animation: skeletonShimmer 1.4s ease-in-out infinite;
}
@keyframes skeletonShimmer {
  0%   { background-position: 200% 0; }
  100% { background-position: -200% 0; }
}

/* SECTION */
.section { display: none; }
.section.active { display: block; animation: sectionFadeIn 0.28s ease; }

@keyframes sectionFadeIn {
  from { opacity: 0; transform: translateY(6px); }
  to   { opacity: 1; transform: translateY(0); }
}

/* STATS BAR */
.stats-bar {
  display: grid;
  grid-template-columns: repeat(5, 1fr);
  gap: 10px;
  margin-bottom: 20px;
}

.stat-card {
  background: var(--bg2);
  border: 1px solid var(--border);
  border-radius: 8px;
  padding: 14px 16px;
  position: relative;
  overflow: hidden;
}

.stat-card::before {
  content: '';
  position: absolute;
  top: 0; left: 0; right: 0;
  height: 2px;
}

.stat-card.green::before { background: var(--green); }
.stat-card.red::before { background: var(--red); }
.stat-card.amber::before { background: var(--amber); }
.stat-card.blue::before { background: var(--blue); }
.stat-card.purple::before { background: var(--purple); }

.stat-label { font-size: 9px; color: var(--text3); letter-spacing: 2px; text-transform: uppercase; margin-bottom: 6px; }
.stat-val { font-family: 'Syne', sans-serif; font-size: 26px; font-weight: 800; line-height: 1; }
.stat-sub { font-size: 10px; color: var(--text2); margin-top: 4px; }

/* FILTERS */
.filters-row {
  display: flex;
  gap: 10px;
  margin-bottom: 16px;
  flex-wrap: wrap;
  align-items: center;
}

.filter-group {
  display: flex;
  align-items: center;
  gap: 8px;
  background: var(--bg2);
  border: 1px solid var(--border);
  border-radius: 6px;
  padding: 6px 12px;
}

.filter-group label { font-size: 10px; color: var(--text2); letter-spacing: 1px; text-transform: uppercase; }

.filter-group input[type="range"] {
  width: 80px;
  accent-color: var(--accent);
}

.filter-group span { font-size: 11px; color: var(--accent); font-weight: 500; min-width: 24px; }

.btn {
  padding: 7px 16px;
  border-radius: 6px;
  font-size: 11px;
  letter-spacing: 1px;
  text-transform: uppercase;
  cursor: pointer;
  border: 1px solid;
  font-family: 'DM Mono', monospace;
  transition: all 0.15s;
}

.btn-primary { background: var(--accent); color: #000; border-color: var(--accent); font-weight: 700; }
.btn-primary:hover { background: var(--accent2); }
.btn
